<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primal Circuit — Contender Art</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px 20px 50px;background:#fff8e9;color:#493c36;font:14px 'Trebuchet MS',sans-serif}.page{max-width:980px;margin:auto}.eyebrow{font:11px monospace;letter-spacing:.12em;color:#a68b74}h1{font-size:38px;letter-spacing:-.05em;margin:8px 0}p{color:#82736a;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.card{overflow:hidden;background:#fffdf7;border:1px solid #eadcc4;border-radius:16px}.scene{height:250px;position:relative;display:grid;place-items:end center;background:linear-gradient(#ddf0e9 0%,#e7efdc 67%,#f3ddb4 67%,#eac790 100%)}.sun{position:absolute;top:30px;left:calc(50% - 55px);height:110px;width:110px;border-radius:100%;background:#f4ca68;box-shadow:0 0 0 15px #f4ca6828}.fighter{position:relative;z-index:1;height:235px;width:205px}.fighter img{height:100%;width:100%}.label{padding:13px 15px}.label h2{font-size:17px;margin:0 0 4px}.label span{font:10px monospace;letter-spacing:.06em;color:#a68b74}@media(max-width:480px){body{padding:24px 14px}h1{font-size:32px}.scene{height:220px}.fighter{height:205px}}
  </style>
</head>
<body><main class="page"><div class="eyebrow">PRIMAL CIRCUIT · CHARACTER ART</div><h1>Meet the contenders</h1><p>One shared visual language, four different arena personalities.</p><section class="grid">
  <article class="card"><div class="scene"><div class="sun"></div><div class="fighter"><img src="assets/rook.svg" alt="Rook"></div></div><div class="label"><h2>Rook</h2><span>EARTH-03 · SCRAPPER</span></div></article>
  <article class="card"><div class="scene"><div class="sun"></div><div class="fighter"><img src="assets/iron-choir.svg" alt="Iron Choir fighter"></div></div><div class="label"><h2>Iron Choir</h2><span>RUSTBELT · BRUISER</span></div></article>
  <article class="card"><div class="scene"><div class="sun"></div><div class="fighter"><img src="assets/bone-collectors.svg" alt="Bone Collectors fighter"></div></div><div class="label"><h2>Bone Collectors</h2><span>DUST BOWL · SKIRMISHER</span></div></article>
  <article class="card"><div class="scene"><div class="sun"></div><div class="fighter"><img src="assets/dune-tyrants.svg" alt="Dune Tyrants fighter"></div></div><div class="label"><h2>Dune Tyrants</h2><span>RED WASTE · CHAMPION</span></div></article>
</section></main></body></html>
